{% extends "base.html" %}
{% block title %}ИАРА — Ново разтоварване{% endblock %}

{% block extra_css %}
<link href="{{ url_for('static', filename='css/inspections.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='css/trace.css') }}" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="form-wrap">
  <a href="{{ url_for('traceBp.list_landings') }}" class="back-link">Назад</a>
  <h1>Ново разтоварване</h1>

  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
      <label>Запис от дневник</label>
      <select name="log_entry_id" required>
        <option value="">— избери дневник —</option>
        {% for log in log_entries %}
        <option value="{{ log.id }}">{{ log.vessel.cfr_number }} / {{ log.vessel.marking }} ({{ log.start_datetime.strftime('%d.%m.%Y') }})</option>
        {% else %}
        <option value="" disabled>— няма подадени дневници —</option>
        {% endfor %}
      </select>
      {% if not log_entries %}
      <p class="field-hint">Нямате подадени дневници. <a href="{{ url_for('logbookBp.create_entry') }}">Създайте първо дневник</a>.</p>
      {% endif %}
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Дата</label>
        <input type="date" name="landing_date" value="{{ today }}" required>
      </div>
      <div class="form-group">
        <label>Място</label>
        <input type="text" name="location" placeholder="напр. Бургас">
      </div>
    </div>

    <div class="form-group">
      <label>Бележки</label>
      <textarea name="notes" rows="2"></textarea>
    </div>

    <div class="form-section-title">Партиди</div>
    <div id="batches">
      <div class="batch-row">
        <input type="text" name="species[]" placeholder="Вид риба" required>
        <input type="number" name="quantity_kg[]" placeholder="Кг" step="0.01" min="0.01" required>
        <button type="button" class="btn-remove" onclick="this.parentElement.remove()" style="display:none">×</button>
      </div>
    </div>
    <button type="button" class="btn-action" onclick="addBatch()">+ Добави партида</button>

    <div class="form-actions">
      <a href="{{ url_for('traceBp.list_landings') }}" class="btn btn-back">Отказ</a>
      <button type="submit" class="btn btn-approve">Запиши</button>
    </div>
  </form>
</div>

<script>
function addBatch() {
  var c = document.getElementById('batches');
  var r = document.createElement('div');
  r.className = 'batch-row';
  r.innerHTML = '<input type="text" name="species[]" placeholder="Вид риба" required> <input type="number" name="quantity_kg[]" placeholder="Кг" step="0.01" min="0.01" required> <button type="button" class="btn-remove" onclick="this.parentElement.remove()">×</button>';
  c.appendChild(r);
}
</script>
{% endblock %}
