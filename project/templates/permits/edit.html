{% extends "base.html" %}
{% block title %}ИАРА — Редактирай разрешително {{ permit.permit_number }}{% endblock %}

{% block extra_css %}
<link href="{{ url_for('static', filename='css/permits.css') }}" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="permits-wrap-form">
    <div class="page-header">
        <a href="{{ url_for('permitsBp.permit_detail', permit_id=permit.id) }}" class="back-link">Назад</a>
        <h1>Редактирай разрешително {{ permit.permit_number }}</h1>
    </div>

    <div class="card">
        <form method="POST" action="{{ url_for('permitsBp.edit_permit', permit_id=permit.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label>Номер</label>
                <input type="text" value="{{ permit.permit_number }}" disabled class="readonly-input">
            </div>

            <div class="form-group">
                <label>Кораб</label>
                <input type="text" value="{{ permit.vessel.cfr_number }} / {{ permit.vessel.marking }}" disabled class="readonly-input">
            </div>

            <div class="form-group">
                <label>Притежател</label>
                <input type="text" value="{{ permit.holder.full_name }}" disabled class="readonly-input">
            </div>

            <div class="form-group">
                <label>Издадено на</label>
                <input type="text" value="{{ permit.issued_date.strftime('%d.%m.%Y') }}" disabled class="readonly-input">
            </div>

            <div class="form-group">
                <label for="valid_until">Важи до</label>
                <input type="date" id="valid_until" name="valid_until" value="{{ permit.valid_until.isoformat() }}" required>
            </div>

            <div class="form-group">
                <label for="captain_name">Капитан</label>
                <input type="text" id="captain_name" name="captain_name" value="{{ permit.captain_name or '' }}">
            </div>

            <div class="form-group">
                <label for="captain_license">Лиценз на капитана</label>
                <input type="text" id="captain_license" name="captain_license" value="{{ permit.captain_license or '' }}">
            </div>

            <div class="form-group">
                <label for="allowed_gear">Разрешени уреди</label>
                <input type="text" id="allowed_gear" name="allowed_gear" value="{{ permit.allowed_gear or '' }}">
            </div>

            <button type="submit" class="btn btn-primary form-full-width">
                Запази промените →
            </button>
        </form>
    </div>
</div>
{% endblock %}
